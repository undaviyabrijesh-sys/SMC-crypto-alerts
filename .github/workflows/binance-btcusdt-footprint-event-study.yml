name: Binance BTCUSDT multi-month true-footprint event study

on:
  push:
    branches:
      - ai-quant-rebuild
    paths:
      - "research/BINANCE_BTCUSDT_TRUE_FOOTPRINT_MULTI_MONTH_EVENT_STUDY_PREREGISTRATION_2026-11-19.md"
      - "research/binance_btcusdt_true_footprint_event_study.py"
      - ".github/workflows/binance-btcusdt-footprint-event-study.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: binance-btcusdt-footprint-event-study
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month:
          - "2026-06"
          - "2026-07"
          - "2026-08"
          - "2026-09"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-quant-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install event-study dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26" "pandas>=2.1" "requests>=2.31"
      - name: Compile and run deterministic event-study tests
        run: |
          python -m py_compile research/binance_btcusdt_true_footprint_event_study.py research/binance_btcusdt_true_footprint_build.py
          python research/binance_btcusdt_true_footprint_event_study.py --self-test
      - name: Download frozen monthly footprint artifact
        uses: actions/download-artifact@v4
        with:
          name: binance-btcusdt-true-footprint-${{ matrix.month }}
          path: results/input-${{ matrix.month }}
          run-id: 44513565570
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frozen monthly event study
        env:
          MONTH: ${{ matrix.month }}
        run: |
          python research/binance_btcusdt_true_footprint_event_study.py \
            --month "$MONTH" \
            --input-dir "results/input-$MONTH" \
            --output-dir "results/event-study-$MONTH"
      - name: Add monthly event report to job summary
        if: always()
        env:
          MONTH: ${{ matrix.month }}
        run: |
          REPORT="results/event-study-$MONTH/report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No event-study report produced for $MONTH." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain monthly event-study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-btcusdt-footprint-event-study-${{ matrix.month }}
          path: results/event-study-${{ matrix.month }}/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

  pooled:
    needs: monthly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-quant-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pooled-analysis dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26" "pandas>=2.1"
      - name: Download all monthly event ledgers
        uses: actions/download-artifact@v4
        with:
          pattern: binance-btcusdt-footprint-event-study-2026-*
          path: results/monthly-events
          merge-multiple: false
      - name: Run pooled day-cluster analysis
        run: |
          python research/binance_btcusdt_true_footprint_event_study.py \
            --aggregate-dir results/monthly-events \
            --output-dir results/pooled-event-study
      - name: Add pooled report to workflow summary
        if: always()
        run: |
          REPORT="results/pooled-event-study/pooled_report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pooled event-study report produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain pooled event-study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-btcusdt-footprint-event-study-pooled-2026-11-19
          path: results/pooled-event-study/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
