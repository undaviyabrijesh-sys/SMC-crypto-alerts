name: BTC EMT-inspired exhaustion event study

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/btc_emt_exhaustion_event_study.py"
      - ".github/workflows/btc-emt-exhaustion-event-study.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-emt-event-study
  cancel-in-progress: true

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Compile and run deterministic synthetic tests
        run: |
          python -m py_compile research/btc_emt_exhaustion_event_study.py
          python research/btc_emt_exhaustion_event_study.py --self-test
      - name: Download two years of BTC 5m candles and run frozen event study
        run: python research/btc_emt_exhaustion_event_study.py --output-dir results/btc-emt-event-study
      - name: Publish result summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd
          p=Path("results/btc-emt-event-study")
          print("# BTC EMT-inspired exhaustion event study")
          m=p/"metadata.json"
          if not m.exists():
              print("No market metadata produced; inspect the failed step logs.")
          else:
              x=json.loads(m.read_text())
              d=x.get("dataset", {})
              print(f"- Valid 5m bars: {d.get('valid_rows')}")
              print(f"- Coverage: {d.get('start_utc')} to {d.get('end_utc')}")
              print(f"- Gaps: {d.get('gap_count')}; zero-volume bars: {d.get('zero_volume')}")
              print(f"- Data SHA-256: {d.get('sha256')}")
              print(f"- OOS evaluated: {x.get('split', {}).get('oos_evaluated')}")
              print(f"- Gate: {x.get('gate')}")
          s=p/"emt_summary.csv"
          if s.exists():
              print("\n## Event metrics and cost sensitivity")
              print(pd.read_csv(s).to_string(index=False))
          PY
      - name: Retain reproducible event-study outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-emt-event-study
          path: results/btc-emt-event-study/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
