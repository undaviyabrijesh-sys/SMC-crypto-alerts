name: ETH liquidity sweep MSS displacement with BTC 4h confirmation

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/eth_liquidity_sweep_mss_displacement_intraday_backtest.py"
      - "research/test_eth_liquidity_sweep_mss_displacement.py"
      - "research/liquidity_sweep_mss_intraday_backtest.py"
      - "research/crt_backtest.py"
      - ".github/workflows/eth-liquidity-sweep-mss-displacement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eth-liquidity-sweep-mss-displacement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile ETH and shared causal sweep engines
        run: |
          python -m py_compile research/eth_liquidity_sweep_mss_displacement_intraday_backtest.py research/liquidity_sweep_mss_displacement_intraday_backtest.py research/liquidity_sweep_mss_intraday_backtest.py research/crt_backtest.py research/test_eth_liquidity_sweep_mss_displacement.py
      - name: Test completed BTC 4h context and gap invalidation
        run: python research/test_eth_liquidity_sweep_mss_displacement.py
      - name: Run preregistered ETH/BTC confirmation matrix
        run: python research/eth_liquidity_sweep_mss_displacement_intraday_backtest.py
      - name: Upload ETH/BTC research outputs and exact source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-liquidity-sweep-mss-btc-confirmation-${{ github.run_id }}
          path: |
            eth_liquidity_displacement_results/
            eth_liquidity_source_data/
            btc_context_source_data/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
