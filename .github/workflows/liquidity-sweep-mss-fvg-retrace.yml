name: BTC liquidity MSS FVG retracement research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/liquidity_sweep_mss_fvg_retrace_intraday_backtest.py"
      - "research/liquidity_sweep_mss_displacement_intraday_backtest.py"
      - "research/liquidity_sweep_mss_intraday_backtest.py"
      - ".github/workflows/liquidity-sweep-mss-fvg-retrace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile FVG retracement research
        run: python -m py_compile research/liquidity_sweep_mss_fvg_retrace_intraday_backtest.py research/liquidity_sweep_mss_displacement_intraday_backtest.py research/liquidity_sweep_mss_intraday_backtest.py
      - name: Run preregistered FVG retracement matrix
        run: python research/liquidity_sweep_mss_fvg_retrace_intraday_backtest.py
      - name: Upload FVG retracement research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-liquidity-mss-fvg-retracement
          path: liquidity_fvg_retrace_results/
          if-no-files-found: warn
          retention-days: 30
