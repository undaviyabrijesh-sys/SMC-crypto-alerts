name: Intraday BTCUSD Supertrend continuation research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/supertrend_intraday_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile intraday Supertrend research
        run: python -m py_compile research/supertrend_intraday_backtest.py
      - name: Run intraday Supertrend matrix
        run: python research/supertrend_intraday_backtest.py
      - name: Upload intraday Supertrend outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-supertrend-research
          path: supertrend_intraday_results/
          if-no-files-found: warn
          retention-days: 30
