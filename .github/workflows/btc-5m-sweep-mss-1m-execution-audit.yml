name: BTC SMC 5m entries with 1m execution replay audit

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/btc_5m_sweep_mss_1m_execution_audit.py"
      - ".github/workflows/btc-5m-sweep-mss-1m-execution-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-smc-1m-execution-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests
      - name: Compile and run synthetic replay tests
        run: |
          python -m py_compile research/btc_5m_sweep_mss_1m_execution_audit.py
          python research/btc_5m_sweep_mss_1m_execution_audit.py --self-test
      - name: Download BTC 5m and 1m history and replay frozen SMC candidates
        run: python research/btc_5m_sweep_mss_1m_execution_audit.py --output-dir results/btc-5m-sweep-mss-1m-audit
      - name: Add audit summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd
          p=Path("results/btc-5m-sweep-mss-1m-audit")
          print("# BTC SMC 1m execution replay audit")
          m=p/"metadata.json"
          if not m.exists():
              print("No metadata produced; inspect failed step logs.")
          else:
              x=json.loads(m.read_text())
              print(f"- 5m rows: {x.get('five_minute_rows')}")
              print(f"- 5m gaps: {x.get('five_minute_gaps')}")
              print(f"- 1m quality: {x.get('one_minute_quality')}")
              print(f"- 1m/5m OHLC alignment: {x.get('one_minute_to_five_minute_alignment')}")
              print(f"- OOS evaluated: {x.get('oos_evaluated')}")
          s=p/"frozen_candidate_1m_replay_summary.csv"
          if s.exists():
              print("\n## Frozen candidate replay metrics")
              print(pd.read_csv(s).to_string(index=False))
          PY
      - name: Retain replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-5m-sweep-mss-1m-audit-${{ github.run_id }}
          path: results/btc-5m-sweep-mss-1m-audit/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
