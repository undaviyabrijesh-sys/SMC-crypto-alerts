name: Intraday BTCUSD anchored VWAP reversion research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/vwap_reversion_intraday_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile research script
        run: python -m py_compile research/vwap_reversion_intraday_backtest.py
      - name: Run intraday anchored VWAP matrix
        run: python research/vwap_reversion_intraday_backtest.py
      - name: Upload intraday research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-vwap-research
          path: vwap_intraday_results/
          if-no-files-found: warn
          retention-days: 30
