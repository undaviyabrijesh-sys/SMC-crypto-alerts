name: Intraday BTCUSD Donchian ATR trailing-stop research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/donchian_atr_trailing_intraday_backtest.py"
      - ".github/workflows/donchian-atr-trailing-intraday.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile Donchian ATR trailing research
        run: python -m py_compile research/donchian_atr_trailing_intraday_backtest.py
      - name: Run preregistered 384-configuration matrix
        run: python research/donchian_atr_trailing_intraday_backtest.py
      - name: Upload Donchian ATR trailing outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-donchian-atr-trailing
          path: donchian_atr_trailing_results/
          if-no-files-found: warn
          retention-days: 30
