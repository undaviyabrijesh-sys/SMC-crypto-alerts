name: BTC ETH Volume Profile Delta TPO zone backtest

on:
  push:
    branches:
      - ai-quant-rebuild
    paths:
      - "research/orderflow_profile_backtest.py"
      - "research/ORDERFLOW_ZONE_BACKTEST_PREREGISTRATION_2026-11-17.md"
      - ".github/workflows/btc-eth-orderflow-zone-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-eth-orderflow-zone-backtest-${ github.ref }
  cancel-in-progress: true

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN_ORDERFLOW_PROFILE:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-quant-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26" "pandas>=2.1" "requests>=2.31"
      - name: Compile and run deterministic tests
        run: |
          python -m py_compile research/orderflow_profile_backtest.py
          python research/orderflow_profile_backtest.py --self-test
      - name: Download two years of BTC and ETH USD-M futures 5m data and run frozen research matrix
        run: |
          python research/orderflow_profile_backtest.py \
            --years 2 \
            --data-dir results/orderflow-profile/data \
            --output-dir results/orderflow-profile/report \
            --request-delay 0.15
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f results/orderflow-profile/report/summary.md ]; then
            cat results/orderflow-profile/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Order-flow zone backtest did not produce a summary. Inspect preceding logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish reproducible summary and metrics to research branch
        if: success()
        env:
          GH_TOKEN: ${ github.token }
        run: |
          mkdir -p quant_discovery
          cp results/orderflow-profile/report/summary.md quant_discovery/ORDERFLOW_ZONE_BACKTEST_LATEST.md
          cp results/orderflow-profile/report/metadata.json quant_discovery/ORDERFLOW_ZONE_BACKTEST_LATEST.json
          cp results/orderflow-profile/report/metrics.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_METRICS_LATEST.csv
          cp results/orderflow-profile/report/monthly_pnl.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_MONTHLY_LATEST.csv
          cp results/orderflow-profile/report/regime_attribution.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_REGIME_LATEST.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add quant_discovery/ORDERFLOW_ZONE_BACKTEST_LATEST.md quant_discovery/ORDERFLOW_ZONE_BACKTEST_LATEST.json quant_discovery/ORDERFLOW_ZONE_BACKTEST_METRICS_LATEST.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_MONTHLY_LATEST.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_REGIME_LATEST.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish BTC ETH order-flow zone backtest results"
            git push origin HEAD:ai-quant-rebuild
          fi
      - name: Retain raw data, trade ledger and detailed outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-orderflow-zone-backtest-${ github.run_id }
          path: results/orderflow-profile/
          if-no-files-found: warn
          retention-days: 30
