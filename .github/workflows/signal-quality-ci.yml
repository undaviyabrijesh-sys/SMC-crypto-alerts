name: signal-quality-ci
on:
  push:
    branches:
      - audit/signal-quality-hardening
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python test_synthetic.py
      - run: python test_quality.py
      - run: python test_signal_safety.py
