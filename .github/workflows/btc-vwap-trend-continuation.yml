name: BTC VWAP trend continuation intraday research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/btc_vwap_trend_continuation_backtest.py"
      - ".github/workflows/btc-vwap-trend-continuation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-vwap-trend-continuation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run deterministic tests
        run: |
          python -m py_compile research/btc_vwap_trend_continuation_backtest.py
          python research/btc_vwap_trend_continuation_backtest.py --self-test
      - name: Download two years of BTCUSD traded 5m candles
        run: >-
          python bootstrap_historical_data.py
          --years 2
          --symbols BTC
          --timeframes 5m
          --output-dir historical_data
          --request-delay 0.2
          --retries 6
      - name: Run preregistered VWAP trend-continuation matrix
        run: |
          python research/btc_vwap_trend_continuation_backtest.py \
            --price-5m-csv historical_data/BTC_5m.csv \
            --output-dir results/btc-vwap-trend
      - name: Add verified results to job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd
          root = Path("results/btc-vwap-trend")
          print("# BTC VWAP trend-continuation research")
          meta_path = root / "metadata.json"
          if not meta_path.exists():
              print("No metadata produced; inspect the failed step logs.")
          else:
              m = json.loads(meta_path.read_text())
              for key in ("symbol", "timeframe", "data", "csv_sha256",
                          "train_end_utc", "validation_end_utc", "configurations",
                          "training_eligible", "training_shortlist",
                          "validation_passes", "oos_evaluated", "selected_config",
                          "selected_oos_12bp"):
                  print(f"- {key}: {m.get(key)}")
              matrix_path = root / "matrix.csv"
              if matrix_path.exists():
                  d = pd.read_csv(matrix_path)
                  cols = [c for c in (
                      "band_atr", "confirmation", "volume_mult", "stop", "target_r",
                      "session", "four_hour_slope_filter",
                      "train_trades", "train_win_rate_pct", "train_profit_factor",
                      "train_net_R", "train_max_drawdown_R", "train_max_losing_streak",
                      "train_positive_month_fraction", "validation_trades",
                      "validation_win_rate_pct", "validation_profit_factor",
                      "validation_net_R", "validation_max_drawdown_R",
                      "validation_max_losing_streak", "validation_positive_month_fraction",
                      "train_gate", "validation_gate"
                  ) if c in d.columns]
                  print("\n## Top training candidates")
                  print(d.sort_values("train_net_R", ascending=False)[cols].head(10).to_string(index=False))
                  print("\n## Top validation candidates")
                  print(d.sort_values("validation_net_R", ascending=False)[cols].head(10).to_string(index=False))
              for filename, title in (
                  ("diagnostic_monthly.csv", "Monthly diagnostics"),
                  ("diagnostic_regimes.csv", "Regime diagnostics"),
                  ("cost_sensitivity.csv", "Cost sensitivity"),
              ):
                  p = root / filename
                  if p.exists() and p.stat().st_size > 1:
                      print(f"\n## {title}")
                      try:
                          d = pd.read_csv(p)
                          print(d.head(80).to_string(index=False) if len(d) else "No rows")
                      except pd.errors.EmptyDataError:
                          print("No rows")
          PY
      - name: Retain inputs and reproducible outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-vwap-trend-continuation-\${{ github.run_id }}
          path: |
            historical_data/BTC_5m.csv
            historical_data/manifest.json
            historical_data/coverage.csv
            results/btc-vwap-trend/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
