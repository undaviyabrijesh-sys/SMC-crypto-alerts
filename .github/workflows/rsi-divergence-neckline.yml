name: BTC RSI divergence neckline-break research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/rsi_divergence_neckline_backtest.py"
      - ".github/workflows/rsi-divergence-neckline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile RSI divergence research
        run: python -m py_compile research/rsi_divergence_neckline_backtest.py
      - name: Run deterministic pivot, gap, causality and execution tests
        run: python research/rsi_divergence_neckline_backtest.py --self-test
      - name: Run preregistered 864-configuration BTC matrix
        run: python research/rsi_divergence_neckline_backtest.py
      - name: Upload RSI divergence research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-rsi-divergence-neckline
          path: rsi_divergence_results/
          if-no-files-found: warn
          retention-days: 30
