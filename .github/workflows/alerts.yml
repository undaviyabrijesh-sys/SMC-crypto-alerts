name: salty-quant-visual-desk

on:
  push:
    branches:
      - ai-quant-rebuild
    paths:
      - .github/workflows/alerts.yml
      - ai_analyst.py
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: salty-quant-visual-desk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyse:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.ENABLE_GITHUB_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore rolling analysis state
        uses: actions/cache@v4
        with:
          path: state.json
          key: salty-quant-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            salty-quant-state-${{ runner.os }}-
      - name: Restore rolling OHLCV and research history
        uses: actions/cache@v4
        with:
          path: |
            market_data/
            research/
          key: salty-quant-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            salty-quant-market-${{ runner.os }}-
      - name: Run offline pipeline tests
        run: python test_visual_pipeline.py
      - name: Check runtime secrets without exposing their values
        id: runtime
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; AI analysis will be skipped."
          elif [ -z "${DISCORD_TRIGGER_WEBHOOK:-}" ] && [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "A Discord webhook secret is not configured; AI analysis will be skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Required AI and Discord secrets are configured."
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_TRIGGER_WEBHOOK: ${{ secrets.DISCORD_TRIGGER_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Download data, render charts, and ask AI analyst
        if: steps.runtime.outputs.ready == 'true'
        run: python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-terra' }}
          OPENAI_REASONING_EFFORT: high
          ENABLE_DAILY_PNL_REPORT: "true"
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_TRIGGER_WEBHOOK: ${{ secrets.DISCORD_TRIGGER_WEBHOOK }}
          DATA_DIR: market_data
          STATE_PATH: state.json
          RESEARCH_PATH: research/visual_decisions.jsonl
