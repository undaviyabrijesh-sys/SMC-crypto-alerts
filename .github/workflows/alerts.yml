name: salty-quant-paper-desk

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: salty-quant-paper-desk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyse:
    # Scheduled runs remain explicitly opt-in. Manual dispatch is one paper-only cycle.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_GITHUB_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore paper state
        uses: actions/cache@v4
        with:
          path: state.json
          key: salty-quant-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            salty-quant-state-${{ runner.os }}-
      - name: Restore rolling OHLCV and research history
        uses: actions/cache@v4
        with:
          path: |
            market_data/
            research/
          key: salty-quant-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            salty-quant-market-${{ runner.os }}-
      - name: Run offline tests
        run: python test_quant_engine.py && python test_quant_backtest.py && python test_dns_engine.py
      - name: Check Discord delivery configuration without reading secrets into logs
        id: runtime
        run: |
          if [ -z "${DISCORD_TRIGGER_WEBHOOK:-}" ] && [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "A Discord webhook secret is not configured; outcome delivery is unavailable."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Discord delivery is configured. The quant engine remains paper-only."
          fi
        env:
          DISCORD_TRIGGER_WEBHOOK: ${{ secrets.DISCORD_TRIGGER_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Fetch closed OHLCV and run deterministic strategy supervisor
        if: steps.runtime.outputs.ready == 'true'
        run: python quant_worker.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_TRIGGER_WEBHOOK: ${{ secrets.DISCORD_TRIGGER_WEBHOOK }}
          DATA_DIR: market_data
          STATE_PATH: state.json
          QUANT_RESEARCH_PATH: research/quant_signals.jsonl
      - name: Upload deterministic candidate and decision log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salty-quant-research-${{ github.run_id }}
          path: research/quant_signals.jsonl
          if-no-files-found: ignore
          retention-days: 14
