name: salty-quant-visual-desk

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: salty-quant-visual-desk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyse:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_GITHUB_SCHEDULE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore rolling analysis state
        uses: actions/cache@v4
        with:
          path: state.json
          key: salty-quant-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            salty-quant-state-${{ runner.os }}-
      - name: Restore rolling OHLCV and research history
        uses: actions/cache@v4
        with:
          path: |
            market_data/
            research/
          key: salty-quant-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            salty-quant-market-${{ runner.os }}-
      - name: Run offline pipeline tests
        run: python test_visual_pipeline.py && python test_dns_engine.py
      - name: Check runtime secrets without exposing their values
        id: runtime
        run: |
          if [ -z "${DISCORD_TRIGGER_WEBHOOK:-}" ] && [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "A Discord webhook secret is not configured; local monitoring cannot deliver alerts."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ -z "${OPENAI_API_KEY:-}" ]; then
              echo "Discord is configured; local DNS monitoring will run and AI map refreshes will pause."
            else
              echo "Discord and AI credentials are configured."
            fi
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_TRIGGER_WEBHOOK: ${{ secrets.DISCORD_TRIGGER_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Download data, refresh due DNS maps, and run local setup watcher
        if: steps.runtime.outputs.ready == 'true'
        run: python dns_worker.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-terra' }}
          OPENAI_REASONING_EFFORT: high
          ENABLE_DAILY_PNL_REPORT: "false"
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_TRIGGER_WEBHOOK: ${{ secrets.DISCORD_TRIGGER_WEBHOOK }}
          DATA_DIR: market_data
          STATE_PATH: state.json
          RESEARCH_PATH: research/visual_decisions.jsonl
      - name: Upload raw and DNS-annotated chart review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salty-quant-dns-review-${{ github.run_id }}
          path: market_data/review_charts/*_*.png
          if-no-files-found: ignore
          retention-days: 7
