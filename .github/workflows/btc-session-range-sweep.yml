name: BTC session range sweep event study
on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - research/btc_session_range_sweep_event_study.py
      - .github/workflows/btc-session-range-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-session-range-sweep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN_SESSION_SWEEP:')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run preregistered BTC session sweep event study
        run: python research/btc_session_range_sweep_event_study.py --days 730 --output-dir research/results/session_sweep
      - name: Publish summary
        if: always()
        run: |
          if [ -f research/results/session_sweep/report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("research/results/session_sweep/report.json").read_text())
          print("# BTC session range sweep event study")
          print(f"- Status: {r['status']}; bars: {r['bars']:,}; events: {r['event_count']}")
          print(f"- Coverage: {r['first_bar_utc']} to {r['last_bar_utc']}; gaps: {r['gap_count']}")
          for h,v in r['summary'].items():
              print(f"- {h}: n={v['n']}, mean net (12bp RT)={v['mean_net_12bps_pct']}%, "
                    f"positive={v['positive_net_fraction_12bps']}")
          print("- Event study only; no trade-management or live-use claim.")
          PY
          else
            echo "Study report missing; inspect failed step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-session-range-sweep-${{ github.run_id }}
          path: research/results/session_sweep/
          if-no-files-found: warn
          retention-days: 14
