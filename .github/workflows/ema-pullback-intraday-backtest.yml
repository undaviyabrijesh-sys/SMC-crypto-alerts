name: Intraday BTCUSD EMA pullback continuation research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/ema_pullback_intraday_backtest.py"
      - "research/crt_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile research modules
        run: python -m compileall -q research
      - name: Run intraday EMA pullback matrix
        run: python research/ema_pullback_intraday_backtest.py
      - name: Upload intraday EMA research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-ema-pullback-research
          path: ema_pullback_intraday_results/
          if-no-files-found: warn
          retention-days: 30
