name: Intraday BTCUSD ADX EMA continuation research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/adx_ema_intraday_backtest.py"
      - ".github/workflows/adx-ema-intraday-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile ADX EMA continuation research
        run: python -m py_compile research/adx_ema_intraday_backtest.py
      - name: Run ADX EMA continuation matrix
        run: python research/adx_ema_intraday_backtest.py
      - name: Upload ADX EMA research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-adx-ema-research
          path: adx_ema_intraday_results/
          if-no-files-found: warn
          retention-days: 30
