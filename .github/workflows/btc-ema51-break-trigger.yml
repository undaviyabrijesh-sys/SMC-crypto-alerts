name: BTC EMA51 pullback break-trigger intraday study

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/btc_ema51_break_trigger_intraday_backtest.py"
      - ".github/workflows/btc-ema51-break-trigger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-ema51-break-trigger-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run deterministic execution/causality tests
        run: |
          python -m py_compile research/btc_ema51_break_trigger_intraday_backtest.py
          python research/btc_ema51_break_trigger_intraday_backtest.py --self-test
      - name: Download two years of BTCUSD traded 15m candles
        run: >-
          python bootstrap_historical_data.py
          --years 2
          --symbols BTC
          --timeframes 15m
          --output-dir historical_data
          --request-delay 0.2
          --retries 6
      - name: Run preregistered 288-configuration matrix
        run: |
          python research/btc_ema51_break_trigger_intraday_backtest.py \
            --csv historical_data/BTC_15m.csv \
            --output-dir results/btc-ema51-break-trigger
      - name: Add verified research summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd
          p=Path("results/btc-ema51-break-trigger")
          print("# BTC 1H/15m EMA51 pullback break-trigger study")
          m=p/"metadata.json"
          if not m.exists():
              print("No metadata produced; inspect the failed step logs.")
          else:
              x=json.loads(m.read_text())
              for k in ("rows","start_utc","end_utc","gap_count","zero_volume",
                        "train_end_utc","validation_end_utc","configurations",
                        "training_eligible","validation_passes","oos_evaluated"):
                  print(f"- {k}: {x.get(k)}")
              q=p/"matrix.csv"
              if q.exists() and q.stat().st_size>1:
                  d=pd.read_csv(q)
                  cols=[c for c in ("touch_tolerance_atr","entry_expiry_bars",
                      "stop_buffer_points","target_r","direction","session","htf_filter",
                      "train_trades","train_win_rate_pct","train_profit_factor","train_net_R",
                      "train_max_drawdown_R","train_max_losing_streak",
                      "validation_trades","validation_win_rate_pct","validation_profit_factor",
                      "validation_net_R","validation_max_drawdown_R","validation_max_losing_streak",
                      "train_gate","validation_gate") if c in d]
                  print("\n## Best training-net candidates")
                  print(d.sort_values("train_net_R",ascending=False)[cols].head(5).to_string(index=False))
                  print("\n## Validation passes")
                  print(d[d.validation_gate][cols].to_string(index=False) if d.validation_gate.any() else "None")
              for name,title in (("diagnostic_monthly.csv","Monthly diagnostics"),
                                 ("diagnostic_regimes.csv","Regime diagnostics"),
                                 ("cost_sensitivity.csv","Cost sensitivity")):
                  q=p/name
                  if q.exists() and q.stat().st_size>1:
                      print(f"\n## {title}")
                      try:
                          z=pd.read_csv(q)
                          print(z.head(80).to_string(index=False) if len(z) else "No rows")
                      except pd.errors.EmptyDataError:
                          print("No rows")
                  elif q.exists():
                      print(f"\n## {title}: no qualifying rows")
          PY
      - name: Retain raw input and reproducible outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-ema51-break-trigger-\${{ github.run_id }}
          path: |
            historical_data/BTC_15m.csv
            historical_data/manifest.json
            historical_data/coverage.csv
            results/btc-ema51-break-trigger/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
