name: BTC ETH train-only cointegration diagnostic

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/btc_eth_train_only_cointegration_diagnostic.py"
      - "research/BTC_ETH_TRAIN_ONLY_COINTEGRATION_DIAGNOSTIC_PREREGISTRATION_2026-11-20.md"
      - "research/requirements-cointegration.txt"
      - "research/btc_eth_pairs_mean_reversion_backtest.py"
      - "bootstrap_historical_data.py"
      - "config.py"
      - ".github/workflows/btc-eth-train-only-cointegration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-eth-train-only-cointegration
  cancel-in-progress: true

jobs:
  train-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository and pinned diagnostic dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check -r research/requirements-cointegration.txt
      - name: Compile and run deterministic diagnostic tests
        run: |
          python -m py_compile research/btc_eth_pairs_mean_reversion_backtest.py
          python -m py_compile research/btc_eth_train_only_cointegration_diagnostic.py
          python research/btc_eth_train_only_cointegration_diagnostic.py --self-test
      - name: Download only the frozen training interval
        run: |
          python bootstrap_historical_data.py \
            --start 2025-09-08T12:00:00Z \
            --end 2026-07-12T04:45:00Z \
            --symbols BTC ETH \
            --timeframes 15m \
            --output-dir historical_data/cointegration_train_only \
            --request-delay 0.2 \
            --retries 6
      - name: Run frozen train-only Engle-Granger and stability diagnostic
        run: |
          python research/btc_eth_train_only_cointegration_diagnostic.py \
            --btc-csv historical_data/cointegration_train_only/BTC_15m.csv \
            --eth-csv historical_data/cointegration_train_only/ETH_15m.csv \
            --manifest historical_data/cointegration_train_only/manifest.json \
            --output-dir results/btc-eth-cointegration-train-only
      - name: Add verified diagnostic summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("results/btc-eth-cointegration-train-only")
          print("# BTC/ETH train-only cointegration diagnostic")
          m = p / "metadata.json"
          if not m.exists():
              print("No metadata produced; inspect the failed step logs.")
          else:
              x = json.loads(m.read_text())
              for k in (
                  "classification", "i1_precondition_pass",
                  "full_train_p_value_raw", "full_train_p_value_holm_adjusted",
                  "significant_stability_blocks_holm_5pct", "holm_family_size",
                  "start_utc", "train_end_exclusive_utc", "btc_rows", "eth_rows",
                  "aligned_rows", "btc_gap_count", "eth_gap_count",
                  "validation_data_downloaded", "oos_data_downloaded",
                  "validation_evaluated", "oos_evaluated",
              ):
                  print(f"- {k}: {x.get(k)}")
              for name in (
                  "cointegration_tests.csv",
                  "unit_root_diagnostics.csv",
                  "rolling_beta_stability.csv",
              ):
                  q = p / name
                  if q.exists():
                      print(f"\n## {name}")
                      print(q.read_text()[:12000])
          PY
      - name: Retain train-only inputs and diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-train-only-cointegration
          path: |
            historical_data/cointegration_train_only/BTC_15m.csv
            historical_data/cointegration_train_only/ETH_15m.csv
            historical_data/cointegration_train_only/manifest.json
            historical_data/cointegration_train_only/coverage.csv
            results/btc-eth-cointegration-train-only/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
