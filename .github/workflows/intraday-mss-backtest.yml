name: Intraday BTCUSD market-structure break and retest research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/intraday_mss_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Run intraday market-structure matrix
        run: python research/intraday_mss_backtest.py
      - name: Upload intraday research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-mss-research
          path: mss_intraday_results/
          if-no-files-found: warn
          retention-days: 30
