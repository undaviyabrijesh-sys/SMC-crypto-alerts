name: CRT Delta BTC v2 validation
on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/crt_backtest_v2.py"
      - ".github/workflows/crt-v2-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy requests
      - name: Run CRT v2 causal research
        run: python research/crt_backtest_v2.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crt-v2-validation
          path: crt_results/
          if-no-files-found: warn
          retention-days: 30
