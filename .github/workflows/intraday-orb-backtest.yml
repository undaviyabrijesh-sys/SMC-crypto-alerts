name: Intraday BTCUSD opening-range breakout research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/intraday_orb_backtest.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy requests
      - name: Compile intraday ORB research
        run: python -m py_compile research/intraday_orb_backtest.py
      - name: Run intraday BTCUSD ORB matrix
        run: python research/intraday_orb_backtest.py
      - name: Upload intraday ORB outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-btcusd-orb-research
          path: intraday_orb_results/
          if-no-files-found: warn
          retention-days: 30
