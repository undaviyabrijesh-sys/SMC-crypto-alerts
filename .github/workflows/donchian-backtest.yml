name: Donchian BTCUSD breakout backtest
on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/donchian_backtest.py"
      - ".github/workflows/donchian-backtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy requests
      - name: Run Donchian matrix
        run: python research/donchian_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donchian-btcusd-backtest
          path: donchian_results/
          if-no-files-found: warn
          retention-days: 30
