name: Gujju The Trader - collect channel transcripts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum videos (0 = entire channel)"
        required: false
        default: "0"
  push:
    branches:
      - gtt-channel-transcripts
    paths:
      - ".github/workflows/gtt-transcripts.yml"
      - "scripts/gtt_transcript_collector.py"
      - "requirements-transcripts.txt"

permissions:
  contents: read

concurrency:
  group: gtt-channel-transcripts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install transcript collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-transcripts.txt

      - name: Collect captions
        run: |
          python scripts/gtt_transcript_collector.py --limit "${{ github.event.inputs.limit || '0' }}"

      - name: Upload transcript archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gujju-the-trader-transcripts
          path: artifacts/gujju-the-trader/
          if-no-files-found: warn
          retention-days: 14
