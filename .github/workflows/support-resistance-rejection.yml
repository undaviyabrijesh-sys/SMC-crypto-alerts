name: BTC support-resistance rejection research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/support_resistance_rejection_backtest.py"
      - ".github/workflows/support-resistance-rejection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-resistance-rejection-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas requests
      - name: Compile research engines
        run: python -m py_compile research/crt_backtest.py research/support_resistance_rejection_backtest.py
      - name: Run deterministic causality and execution tests
        run: python research/support_resistance_rejection_backtest.py --self-test
      - name: Download BTCUSD 15m history and run support-resistance matrix
        run: python research/support_resistance_rejection_backtest.py
      - name: Publish verified job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("support_resistance_rejection_results/metadata.json")
          print("# BTC support/resistance rejection research")
          if not p.exists():
              print("No metadata produced; inspect the research step and logs.")
          else:
              m=json.loads(p.read_text())
              print(f"- Data: {m['rows']:,} BTCUSD 15m candles; {m['gaps']} gaps; {m['start_utc']} to {m['end_utc']}")
              print(f"- Configurations: {m['configurations']}; train eligible: {m['train_eligible']}; validation passes: {m['validation_passes']}")
              print(f"- OOS evaluated: {m['oos_evaluated']}")
              print(f"- Split: train end {m['train_end_utc']}; validation end {m['validation_end_utc']}")
              print(f"- Costs: {m['primary_cost_bps']}bp primary; {m['cost_sensitivity_bps']}bp sensitivity")
              if m['oos_evaluated']:
                  print(f"- OOS summary: {m['oos_summary']}")
          PY
      - name: Upload reproducible data and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-support-resistance-rejection-\${{ github.run_id }}
          path: support_resistance_rejection_results/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
