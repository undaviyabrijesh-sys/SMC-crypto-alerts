name: BTC ETH intraday relative momentum research

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - research/btc_eth_intraday_relative_momentum_backtest.py
      - .github/workflows/btc-eth-intraday-relative-momentum.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-eth-intraday-relative-momentum-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  intraday-relative-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run deterministic tests
        run: |
          python -m py_compile research/btc_eth_intraday_relative_momentum_backtest.py
          python research/btc_eth_intraday_relative_momentum_backtest.py --self-test
      - name: Download two years of BTC and ETH traded 15m candles
        run: >-
          python bootstrap_historical_data.py
          --years 2
          --symbols BTC ETH
          --timeframes 15m
          --output-dir historical_data
          --request-delay 0.2
          --retries 6
      - name: Run frozen intraday relative-momentum matrix
        run: >-
          python research/btc_eth_intraday_relative_momentum_backtest.py
          --btc historical_data/BTC_15m.csv
          --eth historical_data/ETH_15m.csv
          --out results/btc-eth-intraday-relative-momentum
      - name: Publish research summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          import pandas as pd
          p=Path("results/btc-eth-intraday-relative-momentum")
          print("# BTC/ETH intraday relative momentum")
          m=p/"metadata.json"
          if not m.exists():
              print("No market result metadata produced; inspect the failed step.")
          else:
              x=json.loads(m.read_text())
              for k in ("rows","start_utc","last_bar_open_utc","train_end_time_utc",
                        "validation_end_time_utc","validation_passes","oos_evaluated"):
                  print(f"- {k}: {x.get(k)}")
              f=p/"matrix_12bp.csv"
              if f.exists():
                  d=pd.read_csv(f)
                  for sample in ("train","validation"):
                      z=d[d["sample"]==sample].sort_values("net_return_pct",ascending=False).head(5)
                      print(f"\n## Least-bad {sample} diagnostics (not promoted)")
                      print(z[["lookback_h","threshold_pct","hold_h","mode","trades",
                               "win_rate_pct","profit_factor","net_return_pct",
                               "max_drawdown_pct","max_losing_streak"]].to_string(index=False))
              print("\nNo OOS is evaluated unless both preregistered gates pass. R is not applicable because this is a fixed-horizon study without stops.")
          PY
      - name: Retain raw inputs and research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-intraday-relative-momentum-\${{ github.run_id }}
          path: |
            historical_data/BTC_15m.csv
            historical_data/ETH_15m.csv
            historical_data/manifest.json
            historical_data/coverage.csv
            results/btc-eth-intraday-relative-momentum/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
