name: Liquidity sweep BTCUSD backtest

on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - "research/liquidity_sweep_backtest.py"
      - ".github/workflows/liquidity-sweep-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy requests
      - name: Run liquidity sweep matrix
        run: python research/liquidity_sweep_backtest.py
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-sweep-btcusd-backtest
          path: |
            liquidity_sweep_results/
            crt_results/BTCUSD_15m.csv
          if-no-files-found: warn
          retention-days: 30
