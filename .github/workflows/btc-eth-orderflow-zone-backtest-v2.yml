name: BTC ETH Order-Flow Zone Backtest V2 (Wilder ATR and split-safe)

on:
  push:
    branches:
      - ai-quant-rebuild
    paths:
      - "research/orderflow_profile_backtest_v2.py"
      - "research/ORDERFLOW_ZONE_BACKTEST_PREREGISTRATION_2026-11-17.md"
      - ".github/workflows/btc-eth-orderflow-zone-backtest-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-eth-orderflow-zone-backtest-v2
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN_ORDERFLOW_PROFILE_V2:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-quant-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26" "pandas>=2.1" "requests>=2.31"
      - name: Compile and run deterministic tests
        run: |
          python -m py_compile research/orderflow_profile_backtest_v2.py
          python research/orderflow_profile_backtest_v2.py --self-test
      - name: Download two years of BTC and ETH USD-M futures 5m data and run corrected frozen matrix
        run: |
          python research/orderflow_profile_backtest_v2.py \
            --years 2 \
            --data-dir results/orderflow-profile-v2/data \
            --output-dir results/orderflow-profile-v2/report \
            --request-delay 0.15
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f results/orderflow-profile-v2/report/summary.md ]; then
            cat results/orderflow-profile-v2/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Order-flow V2 did not produce a summary. Inspect preceding logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish corrected summary and metrics to research branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p quant_discovery
          cp results/orderflow-profile-v2/report/summary.md quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_LATEST.md
          cp results/orderflow-profile-v2/report/metadata.json quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_LATEST.json
          cp results/orderflow-profile-v2/report/metrics.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_METRICS_LATEST.csv
          cp results/orderflow-profile-v2/report/monthly_pnl.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_MONTHLY_LATEST.csv
          cp results/orderflow-profile-v2/report/regime_attribution.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_REGIME_LATEST.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_LATEST.md quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_LATEST.json quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_METRICS_LATEST.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_MONTHLY_LATEST.csv quant_discovery/ORDERFLOW_ZONE_BACKTEST_V2_REGIME_LATEST.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish corrected BTC ETH order-flow V2 results"
            git push origin HEAD:ai-quant-rebuild
          fi
      - name: Retain raw data, trade ledger and detailed outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-orderflow-zone-backtest-v2
          path: results/orderflow-profile-v2/
          if-no-files-found: warn
          retention-days: 30
