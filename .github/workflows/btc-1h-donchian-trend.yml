name: BTC 1h Donchian breakout with completed 4h trend bias
on:
  push:
    branches: [ai-quant-rebuild]
    paths:
      - research/btc_1h_donchian_trend_event_study.py
      - .github/workflows/btc-1h-donchian-trend.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btc-1h-donchian-trend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  study:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN_DONCHIAN_1H:')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run causal self-tests
        run: python research/btc_1h_donchian_trend_event_study.py --self-test
      - name: Download two years of BTC traded 15m candles
        run: >-
          python bootstrap_historical_data.py
          --years 2
          --symbols BTC
          --timeframes 15m
          --output-dir historical_data
          --request-delay 0.2
          --retries 6
      - name: Run preregistered BTC 1h Donchian breakout event study
        run: >-
          python research/btc_1h_donchian_trend_event_study.py
          --data-csv historical_data/BTC_15m.csv
          --output-dir research/results/btc_1h_donchian_trend
      - name: Publish results
        if: always()
        run: |
          if [ -f research/results/btc_1h_donchian_trend/report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("research/results/btc_1h_donchian_trend/report.json").read_text())
          print("# BTC 1h Donchian breakout with completed 4h trend bias")
          print(f"- Events: {r['raw_event_count']}; matched controls: {r['matched_control_count']} "
                f"({r['match_rate_pct']}%); long={r['long_events']}; short={r['short_events']}")
          print(f"- Data: {r['data']['rows_15m']:,} 15m bars; gaps={r['data']['gap_count_15m']}; "
                f"1h bars={r['complete_1h_bars']:,}")
          for period, horizons in r['periods'].items():
              print(f"## {period}")
              for horizon, v in horizons.items():
                  if 'paired_n' not in v:
                      print(f"- {horizon}: {v.get('status')}")
                  else:
                      print(f"- {horizon}: all-event n={v['event_n_all']}, all-event net 12bp="
                            f"{v['event_12bps']['mean_net_pct']}%; paired n={v['paired_n']}; "
                            f"paired-event={v['paired_event_12bps']['mean_net_pct'] if v['paired_event_12bps'] else None}%; "
                            f"control={v['control_12bps']['mean_net_pct'] if v['control_12bps'] else None}%; "
                            f"paired lift={v['mean_lift_12bps_pct']}%; CI={v['paired_block_bootstrap_95ci_pct']}")
          print("- Forward-return event study only; no stop/target execution PnL claimed.")
          PY
          else
            echo "Study report missing; inspect the failed step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-1h-donchian-trend-${{ github.run_id }}
          path: research/results/btc_1h_donchian_trend/
          if-no-files-found: warn
          retention-days: 14
